configs:
  nginx.conf:
    content: >
      # Universal X-Forwarded-Proto handling for all deployment scenarios

      # - Uses upstream value when behind reverse proxy (Traefik, Caddy, etc.)

      # - Falls back to nginx's scheme for direct connections and port
      forwarding
      upstream wger {
        server web:8000;
      }

      # Used by the /ps/ proxy below. The nginx service's `depends_on:` lists
      # `powersync` so it is started before nginx tries to resolve this hostname.
      upstream powersync {
        server powersync:8080;
      }



      map $$http_x_forwarded_proto $$final_forwarded_proto {
          default $$http_x_forwarded_proto;
          ''      $$scheme;
      }


      server {
          listen 30170;

          location / {
              proxy_pass http://server:8000;

              # Standard proxy headers
              proxy_set_header Host $$http_host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$final_forwarded_proto;
              proxy_set_header X-Forwarded-Host $$http_host;

              # WebSocket support
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";

              proxy_redirect off;
              proxy_http_version 1.1;

              # Timeouts for WebSocket connections
              proxy_read_timeout 86400s;
              proxy_send_timeout 86400s;
          }

          location /static/ {
              alias /wger/static/;

              # Files in the static folder are preprocessed by collectstatic and have a hash
              # in their names, so we can cache longer
              add_header Cache-Control "public, max-age=31536000, immutable" always;
              add_header Vary "Accept-Encoding" always;
          }

          location /media/ {
              alias /wger/media/;
          }

          location /ps/ {
            proxy_pass http://powersync:8080/;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For 
          $$proxy_add_x_forwarded_for;
          }

          location /health {
              return 200;
          }

          client_max_body_size 100M;
      }
  permissions_actions_data:
    content: >-
      [{"read_only": false, "mount_path": "/mnt/permission/redis_redis_data",
      "is_temporary": true, "identifier": "redis_redis_data", "recursive": true,
      "mode": "check", "uid": 568, "gid": 568, "chmod": null}]
