  - User: 1000

  - Group: 1000

  - Supplementary Groups: apps


  ---


  ### Container: [permissions]


  **This container is short-lived.**


  #### Running user/group(s)


  - User: root

  - Group: root

  - Supplementary Groups: apps


  ---


  ### Container: [postgres_upgrade]


  **This container is short-lived.**


  #### Running user/group(s)


  - User: 999

  - Group: 999

  - Supplementary Groups: apps


  ---


  In order to sync exercises, you need to shell into the `server` container

  and run the following commands (This process can take a while):


  ```sh

  python3 manage.py sync-exercises

  python3 manage.py download-exercise-images

  python3 manage.py download-exercise-videos

  ```


  ## Bug Reports and Feature Requests


  If you find a bug in this app or have an idea for a new feature, please file
