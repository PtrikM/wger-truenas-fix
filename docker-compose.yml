#
# Please consult the `Deployment` section in the docs if you want to deploy
# this. You *need* to keep this nginx service, even if you have your own,
# otherwise the static files will not be served correctly! If you do remove
# it, configure yours similarly to what's in config/nginx.conf
# Also take a look at the "Static files" section in the .env file
# configs:
#   nginx.conf:
#     file: ./config/nginx.conf
configs:
  nginx.conf:
    content: |
      upstream wger {
        server web:8000;
      }

      # Used by the /ps/ proxy below. The nginx service's `depends_on:` lists
      # `powersync` so it is started before nginx tries to resolve this hostname.
      upstream powersync {
        server powersync:8080;
      }

      # JSON access log format compatible with the Loki/Alloy parser
      # (same field names as the Caddy parser, so the same dashboard works).
      log_format json_access escape=json
        '{'
          '"ts":"$$time_iso8601",'
          '"client_ip":"$$remote_addr",'
          '"request_method":"$$request_method",'
          '"request_uri":"$$request_uri",'
          '"request_proto":"$$server_protocol",'
          '"request_host":"$$host",'
          '"status":$$status,'
          '"size":$$body_bytes_sent,'
          '"duration":$$request_time,'
          '"user_agent":"$$http_user_agent",'
          '"referer":"$$http_referer"'
        '}';

      # Universal X-Forwarded-Proto handling for all deployment scenarios
      # - Uses upstream value when behind reverse proxy (Traefik, Caddy, etc.)
      # - Falls back to nginx's scheme for direct connections and port forwarding
      map $$http_x_forwarded_proto $$final_forwarded_proto {
        default $$http_x_forwarded_proto;
        ''      $$scheme;
      }

      server {

        listen 80;

        access_log /dev/stdout json_access;

        location / {
          proxy_pass http://wger;

          # Standard proxy headers
          proxy_set_header Host $$http_host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$final_forwarded_proto;
          proxy_set_header X-Forwarded-Host $$http_host;

          # WebSocket support
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection "upgrade";

          proxy_redirect off;
          proxy_http_version 1.1;

          # Timeouts for WebSocket connections
          proxy_read_timeout 86400s;
          proxy_send_timeout 86400s;
        }

        # Reverse proxy for the PowerSync service, used by the mobile app for offline mode
        location /ps/ {
          proxy_pass http://powersync/;

          proxy_set_header Host $$http_host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$final_forwarded_proto;

          # WebSocket upgrade (used by the diagnostics app and the Web SDK)
          proxy_http_version 1.1;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection "upgrade";

          # Sync streams are long-lived (HTTP/2 streaming POST) and must not
          # be buffered or cut off by short timeouts.
          proxy_buffering off;
          proxy_read_timeout 1d;
          proxy_send_timeout 1d;
        }

        location /static/ {
          alias /wger/static/;

          # Files in the static folder are preprocessed by collectstatic and have a hash
          # in their names, so we can cache longer
          add_header Cache-Control "public, max-age=31536000, immutable" always;
          add_header Vary "Accept-Encoding" always;
        }

        location /media/ {
          alias /wger/media/;
        }

        # Increase max body size to allow for video uploads
        client_max_body_size 100M;
      }

  permissions_actions_data:
    content: >-
      [{"read_only": false, "mount_path": "/mnt/permission/redis_redis_data",
      "is_temporary": true, "identifier": "redis_redis_data", "recursive": true,
      "mode": "check", "uid": 568, "gid": 568, "chmod": null}]
services:
  web:
    image: docker.io/wger/server:latest
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    env_file:
      - ./config/prod.env
    volumes:
      - static:/home/wger/static
      - media:/home/wger/media
    expose:
      - 8000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      start_period: 300s
      retries: 5
    restart: unless-stopped

  powersync:
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy        
    restart: unless-stopped

    image: docker.io/journeyapps/powersync-service:latest
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # The unified service runs an API server and replication worker in the same container.
    # These services can be executed in different containers by using individual entry commands e.g.
    # Start only the API server with
    #   command: ['start', '-r', 'api']
    # Start only the replication worker with
    #   command: ['start', '-r', 'sync']

    # Migrations occur automatically by default. Default migrations can be disabled in `powersync.yaml`:
    #  migrations:
    #   disable_auto_migration: true
    #
    # Service migrations can be manually triggered by starting a container with the
    # following command:
    #     command: ['migrate', 'up']
    # Note that this container must finish executing before starting the sync or unified container.
    command: ["start", "-r", "unified"]

    volumes:
      # Mounts the PowerSync config folder (powersync.yaml + sync_rules.yaml).
      # Paths in an `include:`d file are resolved relative to *this* file,
      # not to the including docker-compose.yml. Production setups that want
      # their own config can override this mount via `volumes: !override`
      # in their compose file.
      - ./services/config-powersync:/config:ro

    env_file:
      - ./config/prod.env

    environment:
      # This is the path (inside the container) to the YAML config file
      # Alternatively the config path can be specified in the command
      # e.g:
      #   command: ['start', '-r', 'unified', '-c', '/config/powersync.yaml']
      #
      # The config file can also be specified in Base 64 encoding
      # e.g.: Via an environment variable
      #   POWERSYNC_CONFIG_B64: [base64 encoded content]
      # or e.g.: Via a command line parameter
      #    command: ['start', '-r', 'unified', '-c64', '[base64 encoded content]']
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml

      # Sync rules can be specified as base 64 encoded YAML
      # e.g: Via an environment variable
      # POWERSYNC_SYNC_RULES_B64: "[base64 encoded sync rules]"
      # or e.g.: Via a command line parameter
      #     command: ['start', '-r', 'unified', '-sync64', '[base64 encoded content]']
      PS_JWKS_URL: http://web:8000/api/v2/powersync-keys

    expose:
      # API
      - 8080

      # Prometheus metrics
      - 9090

  nginx:
    configs:
      - source: nginx.conf
        target: /etc/nginx/conf.d/default.conf
    image: docker.io/nginx:stable
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    depends_on:
      - web
      - powersync
    volumes:
      - static:/wger/static:ro
      - media:/wger/media:ro
      # - ./config/nginx.conf:/etc/nginx/conf.d/default.conf      
    ports:
      - "30170:80"
    healthcheck:
      test: ["CMD", "service", "nginx", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  db:
    shm_size: 256mb
    image: docker.io/postgres:15-alpine
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    env_file:
      - ./config/prod.env
    environment:
      - TZ=Europe/Berlin
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    expose:
      - 5432
    command: [
      "postgres",
      "-c", "wal_level=logical",
      "-c", "shared_buffers=256MB",
      "-c", "effective_cache_size=768MB",
      "-c", "work_mem=8MB",
      "-c", "random_page_cost=1.1",
      "-c", "max_connections=30"
    ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped


  cache:
    image: docker.io/redis
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    expose:
      - 6379
    volumes:
      - redis-data:/data    
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf
      
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # You probably want to limit the memory usage of the cache, otherwise it might
    # hog all the available memory. Remove or change according to your needs.
    #mem_limit: 5gb

  celery_worker:
    image: docker.io/wger/server:latest
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    command: /start-worker
    env_file:
      - ./config/prod.env
    volumes:
      - media:/home/wger/media
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "wger", "inspect", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  celery_beat:
    image: docker.io/wger/server:latest
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    command: /start-beat
    volumes:
      - celery-beat:/home/wger/beat/
    env_file:
      - ./config/prod.env
    depends_on:
      celery_worker:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  celery-beat:
  redis-data:

  # Heads up, if you remove these volumes and use folders directly you need to chown them
  # to the UID and GID 1000 even if it doesn't exist on your system. Also, they should
  # be readable by everyone.
  #
  # https://wger.readthedocs.io/en/latest/administration/errors.html#missing-static-files
  media:
  static:

networks:
  default:
    name: wger_network
